<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registo de Trabalho</title>

<!-- Configuração de Ícones para Smartphone / Desktop (PWA) -->
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --tx: #0f172a;
  --mut: #64748b;
  --bd: #e2e8f0;
  --ac: #0284c7;
  --ac-hover: #0369a1;
  --ok: #16a34a;
  --er: #dc2626;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a;
    --card: #1e293b;
    --tx: #f8fafc;
    --mut: #94a3b8;
    --bd: #334155;
    --ac: #38bdf8;
    --ac-hover: #0284c7;
    --ok: #4ade80;
    --er: #f87171;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px;
}

/* Cabeçalho Minimalista com Logótipo */
.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 24px;
  text-align: center;
}

.header img {
  max-height: 48px;
  width: auto;
  object-fit: contain;
  margin-bottom: 8px;
}

.header h1 {
  font-size: 18px;
  font-weight: 600;
  margin: 0;
  color: var(--mut);
  letter-spacing: -0.01em;
}

/* Cartões */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02);
}

h2 {
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 0 0 12px;
  color: var(--mut);
  font-weight: 600;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--mut);
  margin: 12px 0 6px;
}

select, input[type=text] {
  width: 100%;
  padding: 12px 14px;
  font-size: 15px;
  border: 1px solid var(--bd);
  border-radius: 10px;
  background: var(--bg);
  color: var(--tx);
  outline: none;
  transition: border-color 0.15s ease;
}

select:focus, input[type=text]:focus {
  border-color: var(--ac);
}

button, .btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px 16px;
  margin-top: 12px;
  font-size: 15px;
  font-weight: 600;
  border: 0;
  border-radius: 10px;
  background: var(--ac);
  color: #ffffff;
  text-align: center;
  cursor: pointer;
  transition: background-color 0.15s ease;
}

button:hover, .btn:hover {
  background: var(--ac-hover);
}

button.sec {
  background: transparent;
  color: var(--ac);
  border: 1px solid var(--bd);
}

button.sec:hover {
  background: var(--bg);
}

button.x {
  width: auto;
  margin: 0;
  padding: 4px 8px;
  font-size: 12px;
  background: transparent;
  color: var(--er);
  border: 1px solid var(--bd);
  border-radius: 6px;
}

#msg {
  min-height: 20px;
  margin-top: 10px;
  font-size: 13px;
  font-weight: 500;
}
.ok { color: var(--ok); }
.er { color: var(--er); }

ul { list-style: none; margin: 0; padding: 0; }
li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  border-top: 1px solid var(--bd);
  font-size: 14px;
}
li:first-child { border-top: 0; }
li small { color: var(--mut); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; font-weight: 600; }

details summary {
  cursor: pointer;
  color: var(--ac);
  font-size: 13px;
  font-weight: 500;
  margin-top: 10px;
}

.row { display: flex; gap: 8px; }
.row input { flex: 1; }
.row button { width: auto; margin: 0; padding: 0 16px; }
</style>
</head>
<body>

<main>
  <!-- Topo com Logótipo Manpower TBO e Título -->
  <header class="header">
    <img src="logo.png" alt="Manpower TBO" onerror="this.style.display='none'">
    <h1>Registo de trabalho</h1>
  </header>

  <div id="off" class="card er" hidden>Erro ao ligar ao Supabase. Verifique o ficheiro config.js.</div>

  <div class="card">
    <label for="user">Utilizador</label>
    <select id="user"><option value="">— selecione —</option></select>
    <details>
      <summary>Gerir utilizadores</summary>
      <div class="row" style="margin-top:10px">
        <input type="text" id="newu" placeholder="Nome do utilizador">
        <button id="addu">Adicionar</button>
      </div>
      <ul id="ulist" style="margin-top: 10px;"></ul>
    </details>
  </div>

  <div class="card">
    <h2>Código de barras</h2>
    <label class="btn" for="photo">📷 Tirar foto ao código</label>
    <input type="file" id="photo" accept="image/*" capture="environment" hidden>
    
    <label for="code">Código lido (pode corrigir ou escrever)</label>
    <input type="text" id="code" inputmode="numeric" autocomplete="off">
    
    <button id="save">Guardar registo</button>
    <div id="msg" role="status"></div>
  </div>

  <div class="card">
    <h2>Últimos registos</h2>
    <ul id="rec"><li><small>A carregar registos...</small></li></ul>
    <button class="sec" id="exp">Exportar tudo em CSV</button>
  </div>
</main>

<script>
const $=i=>document.getElementById(i);
let sb=null;
const pad=n=>String(n).padStart(2,'0');
function msg(t,bad){const m=$('msg');m.textContent=t;m.className=bad?'er':'ok'}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

async function scan(file){
  msg('A ler o código…');let code=null;
  try{if('BarcodeDetector' in window){const r=await new BarcodeDetector().detect(await createImageBitmap(file));if(r[0])code=r[0].rawValue}}catch(e){}
  if(!code&&window.ZXing){const url=URL.createObjectURL(file);
    try{code=(await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url)).getText()}catch(e){}
    URL.revokeObjectURL(url)}
  if(code){$('code').value=code;msg('Código lido. Confirme e guarde.')}
  else msg('Não foi possível ler. Tente outra foto, mais perto e com boa luz, ou escreva o código.',1);
}
$('photo').addEventListener('change',e=>{const f=e.target.files[0];if(f)scan(f);e.target.value=''});
$('user').addEventListener('change',()=>store('u',$('user').value));

async function carregarUtilizadores(){
  const {data, error}=await sb.from('utilizadores').select('*').order('nome',{ascending:true});
  if(error)return;
  const sel=$('user'),cur=sel.value||store('u')||'',ul=$('ulist');
  sel.replaceChildren(new Option('— selecione —',''));ul.replaceChildren();
  data.forEach(u=>{
    sel.add(new Option(u.nome,u.nome));
    const li=document.createElement('li'),sp=document.createElement('span'),b=document.createElement('button');
    sp.textContent=u.nome;b.textContent='Remover';b.className='x';
    b.onclick=async()=>{if(confirm('Remover “'+u.nome+'”?')){await sb.from('utilizadores').delete().eq('id',u.id);carregarUtilizadores()}};
    li.append(sp,b);ul.append(li);
  });
  sel.value=cur;if(sel.value!==cur)sel.value='';
}

async function carregarRegistos(){
  const {data, error}=await sb.from('registos').select('*').order('ts',{ascending:false}).limit(30);
  const ul=$('rec');ul.replaceChildren();
  if(error||!data.length){ul.innerHTML='<li><small>Sem registos.</small></li>';return}
  data.forEach(r=>{
    const li=document.createElement('li'),a=document.createElement('code'),b=document.createElement('small');
    a.textContent=r.codigo;b.textContent=r.utilizador+' · '+r.data+' '+r.hora;li.append(a,b);ul.append(li);
  });
}

$('save').addEventListener('click',async()=>{
  const u=$('user').value,c=$('code').value.trim();
  if(!sb)return msg('Base de dados indisponível.',1);
  if(!u)return msg('Selecione o utilizador.',1);
  if(!c)return msg('Leia ou escreva um código de barras.',1);
  const d=new Date();
  const {error}=await sb.from('registos').insert([{
    codigo:c,utilizador:u,
    data:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),
    hora:pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()),
    ts:d.toISOString()
  }]);
  if(error)msg('Erro ao guardar: '+error.message,1);
  else{$('code').value='';msg('Registo guardado.');carregarRegistos()}
});

$('addu').addEventListener('click',async()=>{
  const n=$('newu').value.trim();if(!n||!sb)return;
  const {error}=await sb.from('utilizadores').insert([{nome:n}]);
  if(error)msg('Erro ao adicionar utilizador.',1);
  else{$('newu').value='';carregarUtilizadores()}
});

function q(s){s=String(s);return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
$('exp').addEventListener('click',async()=>{
  if(!sb)return msg('Base de dados indisponível.',1);
  const {data,error}=await sb.from('registos').select('*').order('ts',{ascending:true});
  if(error)return msg('Erro na exportação.',1);
  let csv='\ufeffcodigo_barras;data;hora;utilizador\r\n';
  data.forEach(r=>{csv+=[r.codigo,r.data,r.hora,r.utilizador].map(q).join(';')+'\r\n'});
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  a.href=url;a.download='registos_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  msg(data.length+' registos exportados.');
});

window.addEventListener('DOMContentLoaded',async()=>{
  if(typeof window.supabase==='undefined'||!window.SUPABASE_URL||window.SUPABASE_URL.includes('SUA_URL')){
    $('off').hidden=false;return;
  }
  try{
    sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
    await carregarUtilizadores();
    await carregarRegistos();
    sb.channel('public:utilizadores').on('postgres_changes',{event:'*',schema:'public',table:'utilizadores'},()=>carregarUtilizadores()).subscribe();
    sb.channel('public:registos').on('postgres_changes',{event:'*',schema:'public',table:'registos'},()=>carregarRegistos()).subscribe();
  }catch(e){$('off').hidden=false}
});
</script>
</body>
</html>
